name: GitHub Actions Check
run-name: ${{ github.actor }} Checks 🚀
on: [push, pull_request]
jobs:
  Link-Format-Checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/link-format-chk.sh
  Build-Table-Checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/buildtable.pl >/tmp/table.mediawiki || exit 1
  Diff-Checks:
    name: "Diff Checks (fails until number assignment)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: scripts/diffcheck.sh
  Typo-Checks:
    name: "Typo Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v5

      - name: Check if author is known contributor
        id: check_author
        run: |
          if [[ "${{ github.actor }}" == "knownauthor1" || "${{ github.actor }}" == "knownauthor2" ]]; then
            echo "continue_on_error=true" >> $GITHUB_OUTPUT
          else
            echo "continue_on_error=false" >> $GITHUB_OUTPUT
          fi

      - name: Check spelling
        uses: crate-ci/typos@master
        continue-on-error: ${{ steps.check_author.outputs.continue_on_error == 'true' && contains(github.event.head_commit.author.name, github.event.pull_request.user.login) == false }}
